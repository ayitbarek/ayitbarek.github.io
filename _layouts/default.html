{% if site.header_pages %}
<nav class="site-nav">
  {% for path in site.header_pages %}
    {% assign nav_page = site.pages | where: "path", path | first %}
    {% if nav_page %}
      <a class="page-link" href="{{ nav_page.url | relative_url }}">{{ nav_page.title }}</a>
    {% endif %}
  {% endfor %}
</nav>
{% endif %}
