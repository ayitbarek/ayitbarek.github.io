<header class="site-header">
  <div class="header-container">
    <a href="{{ '/' | relative_url }}" class="logo-link">
      <img src="{{ '/assets/Logo.png' | relative_url }}" alt="UD Logo" class="site-logo">
    </a>
    <div class="title-and-nav">
      <h1 class="site-title">{{ site.title }}</h1>
      {% if site.header_pages %}
      <nav class="site-nav">
        {% for path in site.header_pages %}
          {% assign nav_page = site.pages | where: "path", path | first %}
          {% if nav_page %}
            <a class="page-link" href="{{ nav_page.url | relative_url }}">{{ nav_page.title }}</a>
          {% endif %}
        {% endfor %}
      </nav>
      {% endif %}
    </div>
  </div>
</header>
