<header class="site-header">
  <div class="header-container">
    <h1 class="site-title">{{ site.title }}</h1>
    <nav class="site-nav">
      {% for path in site.header_pages %}
        {% assign nav_page = site.pages | where: "path", path | first %}
        {% if nav_page %}
          <a class="page-link" href="{{ nav_page.url | relative_url }}">{{ nav_page.title }}</a>
        {% endif %}
      {% endfor %}
    </nav>
    <div class="logo-top-right">
      <img src="{{ '/assets/Logo.png' | relative_url }}" alt="UD Logo" class="top-right-logo">
    </div>
  </div>
</header>
