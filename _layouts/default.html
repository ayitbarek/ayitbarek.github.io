<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" />
</head>
<body>

  <div class="site-wrapper">
    <!-- Fixed Header -->
    <header class="site-header">
      <div class="header-container">
        <!-- Logo Link -->
        <a href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/favicon.ico' | relative_url }}" alt="Lab Logo" class="lab-header-logo" />
        </a>

        <!-- Hamburger Icon for Mobile -->
        <button class="hamburger" onclick="toggleMobileMenu()">☰</button>

        <!-- Navigation Menu -->
        <nav class="site-nav" id="mobileMenu">
          <ul class="nav-menu">
  {% for item in site.data.navigation %}
    <li class="dropdown">
      <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% if item.children %}
        <ul class="dropdown-content">
          {% for child in item.children %}
            <li><a href="{{ child.url | relative_url }}">{{ child.title }}</a></li>
          {% endfor %}
        </ul>
      {% endif %}
    </li>
  {% endfor %}
</ul>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="page-content">
      {{ content }}
    </main>

    <!-- Footer -->
<footer class="site-footer">
  <div class="footer-logos">
    <a href="https://www.udel.edu/canr/" target="_blank" rel="noopener noreferrer">
      <img src="/assets/CANR-Logo.png" alt="Partner Logo" class="partner-logo-footer" />
    </a>
  </div>
</footer>


  <!-- JS for Hamburger Menu -->
  <script>
    function toggleMobileMenu() {
      const nav = document.getElementById("mobileMenu");
      nav.classList.toggle("mobile-active");
    }
  </script>

</body>
</html>
